<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SunDose ☀️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- =========================
         البداية
    ========================== -->

    <section id="home" class="screen">

        <div class="brand">
            SunDose ☀️
        </div>

        <div class="home-content">

            <div class="sana-wrap">
                <img
                    src="assets/sana.png"
                    class="sana"
                    alt="سنا"
                >
            </div>

            <h1>
                أهلاً... أنا سنا 💛
            </h1>

            <p class="home-text">
                مش هسألك شوية أسئلة وخلاص...
                عايزة أتعرف عليك الأول،
                وبعدها أبدأ أفهمك وأساعدك واحدة واحدة.
            </p>

            <button
                id="startButton"
                class="primary-btn"
            >
                نتعرف على بعض ☀️
            </button>

        </div>

    </section>


    <!-- =========================
         التعارف
    ========================== -->

    <section
        id="welcome"
        class="screen hidden"
    >

        <div class="brand">
            SunDose ☀️
        </div>

        <div class="progress">
            <span id="progressBar"></span>
        </div>

        <div class="conversation">

            <div class="sana-wrap conversation-sana">

                <img
                    src="assets/sana.png"
                    class="sana small"
                    alt="سنا"
                >

            </div>


            <div class="message">

                <div class="message-name">
                    سنا 💛
                </div>

                <div
                    id="question"
                    class="question"
                ></div>

            </div>


            <div
                id="answerArea"
                class="answer-area"
            ></div>


            <button
                id="nextButton"
                class="primary-btn next-btn"
            >
                تمام، قولي 💛
            </button>

        </div>

    </section>


    <!-- =========================
         العادات
    ========================== -->

    <section
        id="habits"
        class="screen hidden"
    >

        <div class="brand">
            SunDose ☀️
        </div>

        <div class="conversation">

            <div class="sana-wrap conversation-sana">

                <img
                    src="assets/sana.png"
                    class="sana small"
                    alt="سنا"
                >

            </div>


            <div class="message">

                <div class="message-name">
                    سنا 💛
                </div>

                <div id="habitMessage"></div>

            </div>


            <div
                id="habitList"
                class="habit-list"
            ></div>

        </div>

    </section>


    <!-- =========================
         جرعة الشمس
    ========================== -->

    <section
        id="sunDose"
        class="screen hidden"
    >

        <div class="brand">
            SunDose ☀️
        </div>

        <div class="conversation">

            <div class="sana-wrap conversation-sana">

                <img
                    src="assets/sana.png"
                    class="sana small"
                    alt="سنا"
                >

            </div>


            <div class="message">

                <div class="message-name">
                    سنا 💛
                </div>

                <div id="sunMessage"></div>

            </div>


            <div class="sun-placeholder">

                <div class="sun-big">
                    ☀️
                </div>

                <h2>
                    جرعة الشمس
                </h2>

                <p>
                    هنا هنكمل مع سنا خطوة بخطوة
                    ونبني الجرعة حسب بياناتك.
                </p>

            </div>


            <button
                id="backToHabits"
                class="secondary-btn"
            >
                رجوع للعادات
            </button>

        </div>

    </section>

</div>


<script src="app.js"></script>

</body>
</html>
