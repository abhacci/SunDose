<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SunDose ☀️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="sana-app">

        <!-- الشريط العلوي -->
        <header class="app-header">

            <div class="brand">
                <span class="brand-sun">☀️</span>
                <span>SunDose</span>
            </div>

            <button class="more-button" aria-label="المزيد">
                •••
            </button>

        </header>


        <!-- شاشة التعارف -->
        <section id="introScreen" class="screen intro-screen">

            <div class="sana-stage">

                <div class="sun-glow"></div>

                <img
                    src="assets/sana.png"
                    alt="سنا"
                    class="sana-character"
                >

            </div>


            <div class="intro-content">

                <span class="intro-label">
                    رفيقتك الصحية ☀️
                </span>

                <h1>
                    أهلاً... أنا سنا ❤️
                </h1>

                <p>
                    مش جاية أديك أوامر ولا أقولك
                    تعمل إيه طول اليوم.
                    <br>
                    خلينا نتعرف على بعض الأول.
                </p>

            </div>


            <button id="meetSanaButton" class="primary-button">
                نتعرف على بعض ☀️
            </button>

        </section>


        <!-- شاشة المحادثة -->
        <section id="chatScreen" class="screen chat-screen hidden">

            <div id="chatMessages" class="chat-messages">
            </div>


            <div id="typingIndicator" class="typing hidden">
                <span></span>
                <span></span>
                <span></span>
            </div>


            <div id="inputArea" class="input-area hidden">

                <input
                    id="userInput"
                    type="text"
                    autocomplete="off"
                    placeholder="اكتب ردك هنا..."
                >

                <button id="sendButton">
                    ↑
                </button>

            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

                <p id="sanaText">
                    صباح الخير ❤️
                    <br>
                    جاهز نبدأ يومنا؟
                </p>
            </div>

            <button id="startButton" class="start-button">
                نبدأ اليوم ☀️
            </button>

        </section>


        <section class="mini-stats">

            <div>
                <strong id="streak">0</strong>
                <span>يوم متتالي</span>
            </div>

            <div>
                <strong id="points">0</strong>
                <span>نقطة</span>
            </div>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
