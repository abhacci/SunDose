<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SunDose ☀️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- الصفحة الرئيسية -->
    <section id="home" class="screen">

        <div class="brand">SunDose ☀️</div>

        <div class="home-content">

            <img
                src="assets/sana.png"
                class="sana"
                alt="سنا"
            >

            <h1>أهلاً... أنا سنا 💛</h1>

            <p>
                خلّينا نتعرّف على بعض الأول،
                وبعدها أساعدك تختار العادات الصحية
                اللي تناسبك.
            </p>

            <button id="startButton" class="primary-btn">
                نتعرّف على بعض ☀️
            </button>

        </div>

    </section>


    <!-- التعارف -->
    <section id="welcome" class="screen hidden">

        <div class="brand">SunDose ☀️</div>

        <div class="progress">
            <span id="progressBar"></span>
        </div>

        <img
            src="assets/sana.png"
            class="sana small"
            alt="سنا"
        >

        <div class="message">

            <strong>سنا 💛</strong>

            <p id="question"></p>

        </div>

        <div id="answerArea"></div>

        <button id="nextButton" class="primary-btn">
            نكمل سوا ☀️
        </button>

    </section>


    <!-- العادات -->
    <section id="habits" class="screen hidden">

        <div class="brand">SunDose ☀️</div>

        <img
            src="assets/sana.png"
            class="sana small"
            alt="سنا"
        >

        <div class="message">

            <strong>سنا 💛</strong>

            <p id="habitMessage"></p>

        </div>

        <div id="habitList" class="habit-list"></div>

    </section>


    <!-- جرعة الشمس -->
    <section id="sunDose" class="screen hidden">

        <div class="brand">SunDose ☀️</div>

        <img
            src="assets/sana.png"
            class="sana small"
            alt="سنا"
        >

        <div class="message">

            <strong>سنا 💛</strong>

            <p id="sunMessage"></p>

        </div>

        <div class="dose-card">

            <div class="dose-icon">☀️</div>

            <h2>جرعة الشمس</h2>

            <p>
                هنا هنبدأ نبني جرعتك اليومية
                بشكل يناسبك خطوة بخطوة.
            </p>

        </div>

        <button id="backToHabits" class="secondary-btn">
            رجوع للعادات
        </button>

    </section>

</div>


<script src="app.js"></script>

</body>
</html>
