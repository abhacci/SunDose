<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SunDose ☀️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- =========================
             مشهد الترحيب
        ========================== -->

        <section class="welcome-screen" id="welcomeScreen">

            <div class="sana-wrapper" id="sanaWrapper">

                <img
                    id="sanaImage"
                    class="sana-image"
                    src="assets/sana_welcome_01.png"
                    alt="سنا"
                >

                <!-- كلام سنا -->
                <div class="sana-speech" id="sanaSpeech">
                    <span id="speechText"></span>
                </div>

            </div>

        </section>


        <!-- =========================
             التطبيق
        ========================== -->

        <section class="app-content" id="appContent">

            <div class="control-panel">

                <h1>جرّب روح سنا ☀️</h1>

                <div class="reaction-grid">

                    <button>ترحيب 👋</button>
                    <button>فرحانة 😊</button>
                    <button>واثقة 😌</button>
                    <button>فضولية 🤨</button>
                    <button>متحمسة ✨</button>
                    <button>بتفكر 🧐</button>
                    <button>الشمس ☀️</button>
                    <button>المياه 💧</button>
                    <button>هادية 🌿</button>
                    <button>رياضة 🏃‍♀️</button>
                    <button>زعلانة 😔</button>
                    <button>مندهشة 😳</button>
                    <button>إنجاز 🥳</button>
                    <button>الختام 💛</button>

                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
