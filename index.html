<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SunDose ☀️</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="app">


    <!-- =================================
         الصفحة الرئيسية
    ================================== -->

    <section
        id="home"
        class="screen"
    >

        <div class="brand">
            ☀️ SunDose
        </div>


        <div class="home-content">

            <div class="sana-stage premium">

                <div
                    id="sanaReaction"
                    class="sana-reaction hidden"
                >
                    ✨
                </div>

                <img
                    id="sanaImage"
                    src="assets/sana_welcome_01.png"
                    class="sana sana-character"
                    alt="سنا"
                >

            </div>


            <div class="sana-message">

                <strong>
                    سنا 💛
                </strong>

                <p
                    id="introText"
                    class="dialogue"
                ></p>

            </div>


            <button
                id="introNext"
                class="primary-btn next-btn"
            >
                كمّل معايا 💛
            </button>


            <button
                id="startButton"
                class="primary-btn next-btn hidden"
            >
                نتعرّف على بعض ☀️
            </button>

        </div>

    </section>



    <!-- =================================
         التعارف
    ================================== -->

    <section
        id="welcome"
        class="screen hidden"
    >

        <div class="brand">
            ☀️ SunDose
        </div>


        <div class="progress">

            <span
                id="progressBar"
            ></span>

        </div>


        <div class="sana-stage">

            <img
                id="questionSana"
                src="assets/sana_calm.png"
                class="sana small sana-character"
                alt="سنا"
            >

        </div>


        <div class="sana-message">

            <strong>
                سنا 💛
            </strong>

            <p
                id="question"
                class="dialogue"
            ></p>

        </div>


        <div
            id="answerArea"
            class="answer-area"
        ></div>


        <button
            id="nextButton"
            class="primary-btn next-btn"
        >
            نكمّل سوا 💛
        </button>

    </section>



    <!-- =================================
         العادات
    ================================== -->

    <section
        id="habits"
        class="screen hidden"
    >

        <div class="brand">
            ☀️ SunDose
        </div>


        <div class="sana-stage">

            <img
                id="habitSana"
                src="assets/sana_happy.png"
                class="sana small sana-character"
                alt="سنا"
            >

        </div>


        <div class="sana-message">

            <strong>
                سنا 💛
            </strong>

            <p
                id="habitMessage"
                class="dialogue"
            ></p>

        </div>


        <div
            id="habitList"
            class="habit-list"
        ></div>

    </section>



    <!-- =================================
         جرعة الشمس
    ================================== -->

    <section
        id="sunDose"
        class="screen hidden"
    >

        <div class="brand">
            ☀️ SunDose
        </div>


        <!-- سنا كبيرة فوق المشهد -->

        <div class="sana-stage">

            <img
                id="sunSana"
                src="assets/sana_sun_01.png"
                class="sana sana-character"
                alt="سنا"
            >

        </div>


        <!-- كلام سنا -->

        <div class="sana-message">

            <strong>
                سنا 💛
            </strong>

            <p
                id="sunMessage"
                class="dialogue"
            ></p>

        </div>


        <!-- =================================
             مشهد الشمس
        ================================== -->

        <div
            id="sunScene"
            class="sun-scene scene-morning"
        >

            <div
                id="sunGlow"
                class="sun-glow"
            ></div>


            <div
                id="sunRays"
                class="sun-rays"
            ></div>


            <div
                id="sunOrb"
                class="sun-orb"
            ></div>

        </div>


        <!-- =================================
             بيانات المستخدم
        ================================== -->

        <div class="dose-data">

            <div class="dose-data-card">

                <small>
                    درجة البشرة
                </small>

                <strong
                    id="doseSkinValue"
                >
                    —
                </strong>

            </div>


            <div class="dose-data-card">

                <small>
                    وقت التعرض
                </small>

                <strong
                    id="doseTimeValue"
                >
                    —
                </strong>

            </div>


            <div class="dose-data-card">

                <small>
                    المكان
                </small>

                <strong
                    id="doseLocationValue"
                >
                    —
                </strong>

            </div>

        </div>


        <!-- =================================
             كارت جرعة الشمس
        ================================== -->

        <div class="dose-card">

            <div class="dose-icon">
                ☀
            </div>


            <h2>
                جرعة الشمس
            </h2>


            <p>
                هنا هنبدأ نبني جرعتك اليومية
                بشكل يناسب بياناتك خطوة بخطوة.
                مش هنفترض رقم ثابت لكل الناس.
            </p>


            <div
                id="doseStatus"
                class="dose-status"
            >
                جاهز لقراءة مؤشر الأشعة فوق البنفسجية
            </div>

        </div>


        <button
            id="backToHabits"
            class="secondary-btn"
            style="margin-top:14px;"
        >
            رجوع للعادات
        </button>

    </section>


</div>


<script src="app.js"></script>

</body>

</html>
