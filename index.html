<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SunDose ☀️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- =========================
         الصفحة الرئيسية
    ========================== -->

    <section id="home" class="screen">

        <div class="brand">SunDose ☀️</div>

        <div class="home-content">

            <div class="sana-wrap">
                <img
                    src="assets/sana.png"
                    class="sana"
                    id="homeSana"
                    alt="سنا"
                >
            </div>

            <h1>أهلاً... أنا سنا 💛</h1>

            <p class="home-text">
                مش هسألك كام سؤال وخلاص...
                أنا عايزة أعرفك بجد، وأفهم جسمك ومكانك وعاداتك،
                وبعدها نمشي سوا خطوة خطوة.
            </p>

            <button id="startButton" class="primary-btn">
                نبدأ سوا ☀️
            </button>

        </div>

    </section>


    <!-- =========================
         شاشة التعارف
    ========================== -->

    <section id="welcome" class="screen hidden">

        <div class="brand">SunDose ☀️</div>

        <div class="progress">
            <span id="progressBar"></span>
        </div>

        <div class="sana-area" id="sanaArea">

            <img
                src="assets/sana.png"
                class="sana sana-chat"
                id="chatSana"
                alt="سنا"
            >

        </div>

        <div class="message">

            <div class="message-name">
                سنا 💛
            </div>

            <div
                id="question"
                class="typing-text"
            ></div>

        </div>

        <div id="answerArea"></div>

        <div class="actions">

            <button
                id="nextButton"
                class="primary-btn"
            >
                تمام، نكمل ☀️
            </button>

        </div>

    </section>


    <!-- =========================
         مراجعة البيانات
    ========================== -->

    <section id="summary" class="screen hidden">

        <div class="brand">SunDose ☀️</div>

        <div class="sana-area">

            <img
                src="assets/sana.png"
                class="sana sana-chat happy"
                id="summarySana"
                alt="سنا"
            >

        </div>

        <div class="message summary-message">

            <div class="message-name">
                سنا 💛
            </div>

            <div id="summaryText"></div>

        </div>

        <div class="summary-card" id="summaryCard"></div>

        <button
            id="goToHabits"
            class="primary-btn"
        >
            طب وريني نبدأ منين ☀️
        </button>

    </section>


    <!-- =========================
         العادات
    ========================== -->

    <section id="habits" class="screen hidden">

        <div class="brand">SunDose ☀️</div>

        <div class="sana-area">

            <img
                src="assets/sana.png"
                class="sana sana-chat"
                id="habitsSana"
                alt="سنا"
            >

        </div>

        <div class="message">

            <div class="message-name">
                سنا 💛
            </div>

            <div id="habitMessage"></div>

        </div>

        <div id="habitList" class="habit-list"></div>

    </section>


    <!-- =========================
         جرعة الشمس
    ========================== -->

    <section id="sunDose" class="screen hidden">

        <div class="brand">SunDose ☀️</div>

        <div class="sana-area">

            <img
                src="assets/sana.png"
                class="sana sana-chat"
                id="sunSana"
                alt="سنا"
            >

        </div>

        <div class="message">

            <div class="message-name">
                سنا ☀️
            </div>

            <div id="sunMessage"></div>

        </div>

        <div id="sunStepArea"></div>

        <div class="actions">

            <button
                id="sunNext"
                class="primary-btn"
            >
                نكمل ☀️
            </button>

        </div>

    </section>

</div>


<script src="app.js"></script>

</body>
</html>
