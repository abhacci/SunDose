<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SunDose ☀️</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="app">


    <!-- =========================
         الصفحة الرئيسية
    ========================== -->

    <section id="home" class="screen">

        <div class="brand">
            ☀️ SunDose
        </div>


        <div class="home-content">

            <div class="sana-stage premium">

                <div
                    id="sanaReaction"
                    class="sana-reaction hidden"
                >
                    ✨
                </div>

                <img
                    id="sanaImage"
                    src="assets/sana_welcome_01.png"
                    class="sana sana-character"
                    alt="سنا"
                >

            </div>


            <div class="sana-message">

                <strong>
                    سنا 💛
                </strong>

                <p
                    id="introText"
                    class="dialogue"
                ></p>

            </div>


            <button
                id="introNext"
                class="primary-btn next-btn"
            >
                كمّل معايا 💛
            </button>


            <button
                id="startButton"
                class="primary-btn next-btn hidden"
            >
                نتعرّف على بعض ☀️
            </button>

        </div>

    </section>



    <!-- =========================
         التعارف
    ========================== -->

    <section
        id="welcome"
        class="screen hidden"
    >

        <div class="brand">
            ☀️ SunDose
        </div>


        <div class="progress">
            <span id="progressBar"></span>
        </div>


        <div class="sana-stage">

            <img
                id="questionSana"
                src="assets/sana_calm.png"
                class="sana sana-character question-sana"
                alt="سنا"
            >

        </div>


        <div class="sana-message">

            <strong>
                سنا 💛
            </strong>

            <p
                id="question"
                class="dialogue"
            ></p>

        </div>


        <div
            id="answerArea"
            class="answer-area"
        ></div>


        <button
            id="nextButton"
            class="primary-btn next-btn"
        >
            نكمّل سوا 💛
        </button>

    </section>



    <!-- =========================
         العادات
    ========================== -->

    <section
        id="habits"
        class="screen hidden"
    >

        <div class="brand">
            ☀️ SunDose
        </div>


        <div class="sana-stage">

            <img
                id="habitSana"
                src="assets/sana_happy.png"
                class="sana sana-character"
                alt="سنا"
            >

        </div>


        <div class="sana-message">

            <strong>
                سنا 💛
            </strong>

            <p
                id="habitMessage"
                class="dialogue"
            ></p>

        </div>


        <div
            id="habitList"
            class="habit-list"
        ></div>

    </section>



    <!-- =========================
         جرعة الشمس
    ========================== -->

    <section
        id="sunDose"
        class="screen hidden"
    >

        <div class="brand">
            ☀️ SunDose
        </div>


        <div class="sana-stage sun-sana-stage">

            <img
                id="sunSana"
                src="assets/sana_sun_01.png"
                class="sana sana-character sun-sana"
                alt="سنا"
            >

        </div>


        <div class="sana-message sun-dialogue">

            <strong>
                سنا 💛
            </strong>

            <p
                id="sunMessage"
                class="dialogue"
            ></p>

        </div>


        <!--
            هنا الرحلة الجديدة كلها
            بتتبني من JavaScript
        -->

        <div
            id="sunJourney"
            class="sun-journey"
        ></div>


        <button
            id="backToHabits"
            class="secondary-btn"
        >
            رجوع للعادات
        </button>

    </section>


</div>


<script src="app.js"></script>

</body>

</html>
