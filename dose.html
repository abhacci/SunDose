<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SunDose ☀️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <header class="topbar">
            <div class="brand">
                SunDose ☀️
            </div>
        </header>


        <!-- سنا -->
        <section class="hero">

            <div class="sana-wrap">
                <img
                    src="assets/sana.png"
                    alt="سنا"
                    class="sana"
                >
            </div>

            <div class="speech">

                <h1>
                    حلو يا Waleed 😊
                </h1>

                <p>
                    اختار الحاجة اللي حابب تبدأ بيها،
                    وأنا هبدأ معاك خطوة بخطوة.
                </p>

            </div>

        </section>


        <!-- الاختيارات -->
        <section class="choices">

            <button
                class="choice-card"
                type="button"
                onclick="chooseSun()"
            >

                <div class="choice-head">
                    <span>☀️</span>

                    <h2>
                        الشمس
                    </h2>
                </div>

                <p>
                    الخروج في وقت مناسب والتعرّض للشمس
                    بشكل آمن.
                </p>

            </button>


            <button
                class="choice-card"
                type="button"
                onclick="comingSoon('💧 شرب المياه')"
            >

                <div class="choice-head">
                    <span>💧</span>

                    <h2>
                        شرب المياه
                    </h2>
                </div>

                <p>
                    تنظيم شرب المياه خلال اليوم
                    والمحافظة على الترطيب.
                </p>

            </button>


            <button
                class="choice-card"
                type="button"
                onclick="comingSoon('🏃 الرياضة والحركة')"
            >

                <div class="choice-head">
                    <span>🏃</span>

                    <h2>
                        الرياضة والحركة
                    </h2>
                </div>

                <p>
                    المشي والحركة المناسبة لمستواك
                    بشكل منتظم.
                </p>

            </button>


            <button
                class="choice-card"
                type="button"
                onclick="comingSoon('💊 العلاج أو المكملات')"
            >

                <div class="choice-head">
                    <span>💊</span>

                    <h2>
                        العلاج أو المكملات
                    </h2>
                </div>

                <p>
                    تنظيم معلومات العلاج أو المكملات
                    الموصوفة لك.
                </p>

            </button>


            <button
                class="choice-card"
                type="button"
                onclick="comingSoon('🌙 النوم والراحة')"
            >

                <div class="choice-head">
                    <span>🌙</span>

                    <h2>
                        النوم والراحة
                    </h2>
                </div>

                <p>
                    تنظيم النوم والراحة اليومية
                    بشكل أفضل.
                </p>

            </button>

        </section>


        <!-- نتيجة الاختيار -->
        <section
            id="result"
            style="
                display:none;
                margin:25px 0;
                padding:25px;
                background:white;
                border-radius:25px;
                text-align:center;
                box-shadow:0 10px 30px rgba(0,0,0,.08);
            "
        >

            <div
                id="resultIcon"
                style="font-size:50px;"
            >
                ☀️
            </div>

            <h2 id="resultTitle">
                ممتاز!
            </h2>

            <p id="resultText">
                اخترت الشمس.
            </p>

            <button
                type="button"
                onclick="goToSunDose()"
                style="
                    border:0;
                    padding:14px 25px;
                    border-radius:15px;
                    background:#f5b51b;
                    color:white;
                    font-size:17px;
                    font-weight:bold;
                    cursor:pointer;
                "
            >
                ندخل على جرعة الشمس ☀️
            </button>

        </section>

    </main>


    <script>

        function chooseSun() {

            const result =
                document.getElementById("result");

            const resultTitle =
                document.getElementById("resultTitle");

            const resultText =
                document.getElementById("resultText");

            const resultIcon =
                document.getElementById("resultIcon");


            resultIcon.textContent = "☀️";

            resultTitle.textContent =
                "اختيار ممتاز يا Waleed 😊";

            resultText.textContent =
                "الشمس اختيار جميل. سنا جاهزة تمشي معاك خطوة بخطوة في جرعتك اليومية.";


            result.style.display = "block";


            result.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

        }


        function comingSoon(name) {

            alert(
                "اختيارك: " +
                name +
                "\n\nهنضيف الجرعة دي بعد ما نخلص الشمس ❤️"
            );

        }


        function goToSunDose() {

            window.location.href =
                "sun-dose.html";

        }

    </script>

</body>
</html>
