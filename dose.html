<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SunDose ☀️ — جرعتك اليومية</title>

    <link rel="stylesheet" href="dose.css">
</head>

<body>

<main class="page">

    <header class="topbar">
        <div class="brand">SunDose ☀️</div>

        <button class="menu-btn" type="button">•••</button>
    </header>


    <section class="hero">

        <div class="sana-wrap">
            <img
                src="assets/sana.png"
                alt="سنا"
                class="sana"
            >
        </div>

        <div class="speech">

            <h1 id="greeting">
                حلو! نبدأ من هنا 💛
            </h1>

            <p>
                مش هفرض عليك حاجة.
                اختار الحاجة اللي حابب تبدأ بيها،
                وأنا أشرحلك فائدتها الأول.
            </p>

        </div>

    </section>


    <section class="choices">

        <button class="choice-card" data-type="sun" type="button">
            <div class="choice-head">
                <span>☀️</span>
                <h2>الشمس</h2>
            </div>

            <p>
                مثال: الخروج في وقت مناسب والتعرّض للشمس
                بشكل آمن. الشمس مصدر طبيعي لفيتامين D.
            </p>
        </button>


        <button class="choice-card" data-type="water" type="button">
            <div class="choice-head">
                <span>💧</span>
                <h2>شرب المياه</h2>
            </div>

            <p>
                مثال: تنظيم شرب المياه خلال اليوم.
                الترطيب الجيد يساعد جسمك على أداء
                وظائفه بشكل طبيعي.
            </p>
        </button>


        <button class="choice-card" data-type="activity" type="button">
            <div class="choice-head">
                <span>🏃</span>
                <h2>الرياضة والحركة</h2>
            </div>

            <p>
                مثال: المشي أو أي حركة مناسبة لمستواك.
                النشاط المنتظم مفيد للقلب واللياقة والمزاج.
            </p>
        </button>


        <button class="choice-card" data-type="treatment" type="button">
            <div class="choice-head">
                <span>💊</span>
                <h2>العلاج أو المكملات</h2>
            </div>

            <p>
                لو عندك علاج موصوف أو مكمل ثابت،
                نقدر ننظم معلوماته.
                الدواء أو المكمل مش بيتاخد لمجرد اقتراح.
            </p>
        </button>


        <button class="choice-card" data-type="sleep" type="button">
            <div class="choice-head">
                <span>🌙</span>
                <h2>النوم والراحة</h2>
            </div>

            <p>
                مثال: تثبيت وقت نوم مناسب.
                الراحة المنتظمة تساعدك تبدأ يومك
                بطاقة وتركيز أفضل.
            </p>
        </button>

    </section>


    <section class="sana-panel" id="sanaPanel" hidden>

        <div class="panel-icon" id="panelIcon">☀️</div>

        <div class="panel-content">

            <div class="panel-title" id="panelTitle"></div>

            <p id="panelText"></p>

            <div class="tip" id="panelTip"></div>

        </div>

        <button
            class="start-dose"
            id="startDose"
            type="button"
        >
            نكمل مع بعض 💛
        </button>

    </section>

</main>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const cards = document.querySelectorAll(".choice-card");

    const panel = document.getElementById("sanaPanel");
    const icon = document.getElementById("panelIcon");
    const title = document.getElementById("panelTitle");
    const text = document.getElementById("panelText");
    const tip = document.getElementById("panelTip");
    const button = document.getElementById("startDose");

    let selected = null;


    const replies = {

        sun: {
            icon: "☀️",
            title: "اختيار جميل 🌞",
            text: "حلو إنك اخترت الشمس. خلينا نخليها عادة بسيطة وآمنة تناسب يومك.",
            tip: "💛 مش كل حاجة مفيدة لما نزودها... المهم نعرف القدر المناسب."
        },

        water: {
            icon: "💧",
            title: "اختيار ممتاز 💧",
            text: "المياه بداية بسيطة ومهمة. هننظمها مع بعض بطريقة تناسب يومك.",
            tip: "💙 عادة صغيرة تتكرر كل يوم أقوى من حماس يوم واحد."
        },

        activity: {
            icon: "🏃",
            title: "جامد! نتحرك شوية 🏃",
            text: "مش محتاج تبدأ بحاجة صعبة. هنختار حركة تقدر تستمر عليها.",
            tip: "💚 خطوة صغيرة كل يوم أحسن من خطوة كبيرة مرة واحدة."
        },

        treatment: {
            icon: "💊",
            title: "اختيار مهم ❤️",
            text: "لو عندك علاج موصوف أو مكمل، نقدر ننظم معلوماته ومواعيده.",
            tip: "❤️ صحتك مش مكان للتجربة. العلاج يكون بتوجيه المختص."
        },

        sleep: {
            icon: "🌙",
            title: "اختيار هادي وجميل 🌙",
            text: "النوم والراحة جزء مهم من يومك، ونقدر نبدأ بخطوة بسيطة.",
            tip: "💜 الراحة مش تعطيل... الراحة جزء من الاستمرار."
        }

    };


    cards.forEach(function (card) {

        card.addEventListener("click", function () {

            selected = card.dataset.type;

            const reply = replies[selected];

            if (!reply) return;

            icon.textContent = reply.icon;
            title.textContent = reply.title;
            text.textContent = reply.text;
            tip.textContent = reply.tip;

            button.textContent = "نكمل مع بعض 💛";
            button.hidden = false;

            panel.hidden = false;

            panel.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

        });

    });


    button.addEventListener("click", function () {

        if (!selected) return;


        const next = {

            sun: {
                icon: "☀️",
                title: "جرعة الشمس بدأت",
                text: "تمام يا صديقي 🌞 دلوقتي هنحدد مع بعض الطريقة والوقت المناسبين ليومك.",
                tip: "اختار وقت تقدر تلتزم بيه، مش وقت مثالي صعب تحافظ عليه."
            },

            water: {
                icon: "💧",
                title: "جرعة المياه بدأت",
                text: "يلا نبدأ بأول كوب 💧 وبعدها ننظم شرب المياه على مدار يومك.",
                tip: "مش لازم تشرب كل حاجة مرة واحدة."
            },

            activity: {
                icon: "🏃",
                title: "جرعة الحركة بدأت",
                text: "اختار حركة بسيطة تقدر تعملها النهارده ونبني عليها.",
                tip: "الاستمرار أهم من الشدة."
            },

            treatment: {
                icon: "💊",
                title: "جرعة العلاج",
                text: "هنا هننظم العلاج أو المكمل الموجود عندك، من غير ما نخترع علاج أو جرعة.",
                tip: "أي دواء أو مكمل لازم يكون مناسب لك ووفق تعليمات المختص."
            },

            sleep: {
                icon: "🌙",
                title: "جرعة النوم بدأت",
                text: "هنبدأ بتنظيم خطوة واحدة في نومك بدل ما نغير كل حاجة مرة واحدة.",
                tip: "خطوة صغيرة ثابتة أفضل من تغيير كبير لا يستمر."
            }

        };


        const dose = next[selected];

        icon.textContent = dose.icon;
        title.textContent = dose.title;
        text.textContent = dose.text;
        tip.textContent = dose.tip;

        button.textContent = "تمام يا سنا 💛";

        panel.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    });

});

</script>

</body>

                </p>

            </button>

        </section>


        <section
            class="sana-panel"
            id="sanaPanel"
            hidden
        >

            <div
                class="panel-icon"
                id="panelIcon"
            >
                ☀️
            </div>


            <div class="panel-content">

                <div
                    class="panel-title"
                    id="panelTitle"
                ></div>

                <p id="panelText"></p>

                <div
                    class="tip"
                    id="panelTip"
                ></div>

            </div>


            <button
                class="start-dose"
                id="startDose"
                type="button"
            >
                نبدأ الجرعة 💛
            </button>

        </section>

    </main>
