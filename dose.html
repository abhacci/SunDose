<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SunDose ☀️ — جرعتك اليومية</title>

    <link rel="stylesheet" href="dose.css">
</head>

<body>

    <main class="page">

        <!-- =========================
             TOP BAR
        ========================== -->
        <header class="topbar">

            <div class="brand">
                SunDose ☀️
            </div>

            <button class="menu-btn" type="button">
                •••
            </button>

        </header>


        <!-- =========================
             SANA INTRO
        ========================== -->
        <section class="hero">

            <div class="sana-wrap">

                <img
                    src="assets/sana.png"
                    alt="سنا"
                    class="sana"
                >

            </div>


            <div class="speech">

                <div class="sana-name">
                    💛 سنا
                </div>

                <h1 id="greeting">
                    حلو! نبدأ من هنا 😊
                </h1>

                <p>
                    الجزء المهم... أنا مش هفرض عليك حاجة.
                    اختار الحاجة اللي حابب تبدأ بيها،
                    وأنا أشرحلك فائدتها الأول.
                </p>

            </div>

        </section>


        <!-- =========================
             CHOICES
        ========================== -->
        <section class="choices">


            <!-- الشمس -->
            <button
                class="choice-card"
                data-type="sun"
                type="button"
            >

                <div class="choice-head">

                    <span>☀️</span>

                    <h2>
                        الشمس
                    </h2>

                </div>

                <p>
                    مثال: الخروج في وقت مناسب والتعرّض للشمس
                    بشكل آمن. الشمس مصدر طبيعي لفيتامين D.
                </p>

            </button>


            <!-- المياه -->
            <button
                class="choice-card"
                data-type="water"
                type="button"
            >

                <div class="choice-head">

                    <span>💧</span>

                    <h2>
                        شرب المياه
                    </h2>

                </div>

                <p>
                    مثال: تنظيم شرب المياه خلال اليوم.
                    الترطيب الجيد يساعد جسمك على أداء
                    وظائفه بشكل طبيعي.
                </p>

            </button>


            <!-- الرياضة -->
            <button
                class="choice-card"
                data-type="activity"
                type="button"
            >

                <div class="choice-head">

                    <span>🏃</span>

                    <h2>
                        الرياضة والحركة
                    </h2>

                </div>

                <p>
                    مثال: المشي أو أي حركة مناسبة لمستواك.
                    النشاط المنتظم مفيد للقلب واللياقة والمزاج.
                </p>

            </button>


            <!-- العلاج -->
            <button
                class="choice-card"
                data-type="treatment"
                type="button"
            >

                <div class="choice-head">

                    <span>💊</span>

                    <h2>
                        العلاج أو المكملات
                    </h2>

                </div>

                <p>
                    لو عندك علاج موصوف أو مكمل ثابت،
                    نقدر ننظم معلوماته.
                    الدواء أو المكمل مش بيتاخد لمجرد اقتراح.
                </p>

            </button>


            <!-- النوم -->
            <button
                class="choice-card"
                data-type="sleep"
                type="button"
            >

                <div class="choice-head">

                    <span>🌙</span>

                    <h2>
                        النوم والراحة
                    </h2>

                </div>

                <p>
                    مثال: تثبيت وقت نوم مناسب.
                    الراحة المنتظمة تساعدك تبدأ يومك
                    بطاقة وتركيز أفضل.
                </p>

            </button>


        </section>


        <!-- =========================
             SANA RESPONSE PANEL
        ========================== -->
        <section
            class="sana-panel"
            id="sanaPanel"
            hidden
        >

            <div
                class="panel-icon"
                id="panelIcon"
            >
                ☀️
            </div>


            <div class="panel-content">

                <div
                    class="panel-title"
                    id="panelTitle"
                ></div>


                <p
                    id="panelText"
                ></p>


                <div
                    class="tip"
                    id="panelTip"
                ></div>

            </div>


            <button
                class="start-dose"
                id="startDose"
                type="button"
            >
                نبدأ الجرعة 💛
            </button>

        </section>


    </main>


    <!-- =========================
         JAVASCRIPT
         ========================== -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const cards =
                document.querySelectorAll(".choice-card");

            const panel =
                document.getElementById("sanaPanel");

            const panelIcon =
                document.getElementById("panelIcon");

            const panelTitle =
                document.getElementById("panelTitle");

            const panelText =
                document.getElementById("panelText");

            const panelTip =
                document.getElementById("panelTip");

            const startDose =
                document.getElementById("startDose");


            /*
             * ردود سنا
             */

            const replies = {

                sun: {

                    icon: "☀️",

                    title:
                        "اختيار ممتاز يا وليد 💛",

                    text:
                        "حلو إنك اخترت الشمس 😊 خلينا نبدأ بهدوء ونشوف إزاي نخليها جزء مفيد وآمن من يومك، وبطريقة تناسبك أنت.",

                    tip:
                        "☀️ الحكمة: جسمك محتاج الشمس، لكن الأهم إننا نعرف إمتى وقد إيه."
                },


                water: {

                    icon: "💧",

                    title:
                        "اختيار ممتاز 💙",

                    text:
                        "حلو! المياه بداية بسيطة جدًا، لكن تأثيرها مهم. خلينا نخلي شربك للمياه عادة سهلة ومستمرة خلال يومك.",

                    tip:
                        "💧 الحكمة: الحاجة الصغيرة لما تتكرر كل يوم بتعمل فرق كبير."
                },


                activity: {

                    icon: "🏃",

                    title:
                        "اختيار ممتاز 💚",

                    text:
                        "حلو إنك اخترت الحركة. ومش لازم تبدأ بتمرين صعب، هنبدأ بحاجة تناسب مستواك وتقدر تكمل عليها.",

                    tip:
                        "🏃 الحكمة: مش لازم تبدأ بأقوى خطوة، المهم تبدأ بخطوة تقدر تكملها."
                },


                treatment: {

                    icon: "💊",

                    title:
                        "تمام، خلينا نهتم بده ❤️",

                    text:
                        "لو عندك علاج أو مكمل، الأول نفهمه كويس وننظم معلوماته. ومش هنضيف أي دواء أو مكمل من نفسنا.",

                    tip:
                        "💊 الحكمة: صحتك تستاهل إنك تعرف إيه اللي بتاخده وليه."
                },


                sleep: {

                    icon: "🌙",

                    title:
                        "اختيار جميل 💜",

                    text:
                        "النوم مش مجرد راحة، ده جزء مهم من يومك. هنحاول نخليه عادة أهدى وأسهل وتناسب روتينك.",

                    tip:
                        "🌙 الحكمة: الراحة مش تعطيل ليومك، الراحة هي اللي بتخليك تكمل."
                }

            };


            /*
             * عند الضغط على أي اختيار
             */

            cards.forEach(function (card) {

                card.addEventListener("click", function () {

                    const type =
                        card.getAttribute("data-type");

                    const reply =
                        replies[type];

                    if (!reply) {
                        return;
                    }


                    /*
                     * إظهار رد سنا
                     */

                    panel.hidden = false;


                    panelIcon.textContent =
                        reply.icon;


                    panelTitle.textContent =
                        reply.title;


                    panelText.textContent =
                        reply.text;


                    panelTip.textContent =
                        reply.tip;


                    /*
                     * تحديد الاختيار
                     */

                    cards.forEach(function (item) {

                        item.classList.remove("selected");

                    });


                    card.classList.add("selected");


                    /*
                     * تخزين نوع الجرعة
                     */

                    startDose.dataset.type =
                        type;


                    /*
                     * ننزل عند رد سنا
                     */

                    setTimeout(function () {

                        panel.scrollIntoView({

                            behavior: "smooth",

                            block: "center"

                        });

                    }, 100);

                });

            });


            /*
             * زر بدء الجرعة
             */

            startDose.addEventListener("click", function () {

                const type =
                    startDose.dataset.type;


                if (!type) {
                    return;
                }


                const nextPages = {

                    sun: "sun-dose.html",

                    water: "water-dose.html",

                    activity: "activity-dose.html",

                    treatment: "treatment-dose.html",

                    sleep: "sleep-dose.html"

                };


                const nextPage =
                    nextPages[type];


                if (!nextPage) {
                    return;
                }


                startDose.disabled = true;

                startDose.textContent =
                    "ثواني يا صديقي ☀️";


                setTimeout(function () {

                    window.location.href =
                        nextPage;

                }, 450);

            });

        });

    </script>

</body>
</html>
