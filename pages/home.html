<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SunDose ☀️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="dashboard">

        <header class="dashboard-header">

            <div>
                <span class="hello">صباح الخير ☀️</span>
                <h1>SunDose</h1>
            </div>

            <div class="header-sun">🌞</div>

        </header>


        <section class="sana-message">

            <img
                src="../assets/sana.png"
                alt="سنا"
                class="sana-small"
            >

            <div class="message-bubble">
                <strong>جاهز ليوم جديد؟ ❤️</strong>
                <p>
                    خلينا ناخد جرعتنا النهارده
                    ونكمل يومنا بنشاط.
                </p>
            </div>

        </section>


        <section class="dose-card">

            <div class="dose-top">
                <div>
                    <span>جرعة اليوم</span>
                    <strong>0 / 1</strong>
                </div>

                <div class="dose-icon">
                    ☀️
                </div>
            </div>

            <div class="progress">
                <div class="progress-fill"></div>
            </div>

            <button class="dose-button">
                ابدأ جرعتي ☀️
            </button>

        </section>


        <section class="stats">

            <div class="stat">
                <strong>0</strong>
                <span>يوم متتالي 🔥</span>
            </div>

            <div class="stat">
                <strong>0</strong>
                <span>نقطة ⭐</span>
            </div>

        </section>


        <nav class="bottom-nav">

            <button class="active">
                <span>☀️</span>
                الرئيسية
            </button>

            <button>
                <span>📅</span>
                السجل
            </button>

            <button>
                <span>⚙️</span>
                الإعدادات
            </button>

        </nav>

    </main>

</body>
</html>
